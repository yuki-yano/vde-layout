name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes tmux

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup toolchain install 1.88.0 --profile minimal
          rustup override set stable

      - name: Check minimum supported Rust version
        run: cargo +1.88.0 check --all-targets --all-features

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --all-targets --all-features

      - name: Run isolated tmux smoke test
        run: cargo test --test tmux_live -- --ignored --nocapture

      - name: Build release binaries
        run: cargo build --locked --release --bins

      - name: Verify cargo install and both commands
        shell: bash
        run: |
          install_root="$(mktemp -d)"
          cargo install --locked --path . --root "$install_root"
          "$install_root/bin/vde-layout" --version
          "$install_root/bin/vl" --version
          "$install_root/bin/vde-layout" --help > "$install_root/vde-layout.help"
          "$install_root/bin/vl" --help > "$install_root/vl.help"
          diff "$install_root/vde-layout.help" "$install_root/vl.help"
          "$install_root/bin/vde-layout" simple --config examples/basic-layout.yml --dry-run > "$install_root/vde-layout.dry-run"
          "$install_root/bin/vl" simple --config examples/basic-layout.yml --dry-run > "$install_root/vl.dry-run"
          diff "$install_root/vde-layout.dry-run" "$install_root/vl.dry-run"
