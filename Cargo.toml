[package]
name = "vde-layout"
version = "2.0.0"
edition = "2024"
rust-version = "1.88"
description = "Recreate tmux, WezTerm, and Herdr pane layouts from YAML presets"
license = "MIT"
homepage = "https://github.com/yuki-yano/vde-layout"
repository = "https://github.com/yuki-yano/vde-layout"
readme = "README.md"
keywords = ["terminal", "tmux", "wezterm", "layout", "cli"]
categories = ["command-line-utilities", "development-tools"]
publish = ["crates-io"]
include = [
  "/src/**",
  "/tests/**",
  "/examples/**",
  "/Cargo.toml",
  "/Cargo.lock",
  "/README.md",
  "/README.ja.md",
  "/LICENSE",
]

[lib]
name = "vde_layout"
path = "src/lib.rs"

[[bin]]
name = "vde-layout"
path = "src/bin/vde-layout.rs"

[[bin]]
name = "vl"
path = "src/bin/vl.rs"

[dependencies]
base64 = "0.22"
clap = { version = "4.6", features = ["derive"] }
dirs = "6"
indexmap = { version = "2.14", features = ["serde"] }
regex = "1.12"
serde = { version = "1", features = ["derive"] }
serde-saphyr = "0.0.29"
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
shlex = "1.3"
thiserror = "2"
unicode-width = "0.2"
wait-timeout = "0.2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
pretty_assertions = "1.4"
tempfile = "3"
